  workflow_dispatch:

# 3. JOBS (WHAT WORK SHOULD BE DONE?)
# A workflow consists of one or more jobs that run in parallel by default.
jobs:

  # Name of our job: build-and-test
  build-and-test:
    name: Build APK & Run Unit Tests

    # The virtual machine environment provided by GitHub (Linux Ubuntu)
    runs-on: ubuntu-latest

    # 4. STEPS (THE SEQUENTIAL COMMANDS TO EXECUTE IN THIS JOB)
    steps:

      # STEP 1: Download/Checkout your source code from GitHub into the virtual machine
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # STEP 2: Install Java Development Kit (JDK 17) required to compile Android apps
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'          # Use Java 17 for modern Android Gradle Plugin
          distribution: 'temurin'     # Eclipse Temurin OpenJDK distribution
          cache: 'gradle'             # Cache Gradle dependencies so builds run faster on subsequent runs

      # STEP 3: Ensure the Gradle wrapper script (gradlew) has executable permissions
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # STEP 4: Compile the Android project and generate a Debug APK
      # If there are any compilation/syntax errors, this step will FAIL the build.
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # STEP 5: Run all unit tests in the project (e.g., ViewModel and Repository tests)
      # If any unit test fails, this step will FAIL and report the broken test.
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
